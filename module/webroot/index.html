<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>denpa</title>
<style>
  body { font-family: sans-serif; margin: 16px; background: #111; color: #eee; }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  h2 { font-size: 15px; margin: 20px 0 8px; color: #9ecbff; }
  pre { background: #1c1c1e; border-radius: 8px; padding: 10px; overflow-x: auto;
        white-space: pre-wrap; word-break: break-all; font-size: 12px; min-height: 60px; }
  button { background: #2f6feb; color: #fff; border: 0; border-radius: 8px;
           padding: 10px 18px; font-size: 15px; margin: 4px 6px 4px 0; }
  button.sub { background: #444; }
  button:disabled { opacity: .35; }
  a.btn { display: inline-block; background: #2f6feb; color: #fff; border-radius: 8px;
          padding: 10px 18px; font-size: 15px; text-decoration: none;
          margin: 4px 6px 4px 0; }
  .row { margin: 6px 0; }
  .note { color: #aaa; font-size: 12px; }
  pre.logbox { height: 30vh; min-height: 140px; max-height: 420px;
               overflow-y: auto; }
</style>
</head>
<body>
<h1>denpa</h1>

<h2>状態</h2>
<pre id="status">読み込み中…</pre>

<h2>ログ: エージェント</h2>
<pre id="log-agent" class="logbox"></pre>

<h2>ログ: denpa 本体</h2>
<pre id="log-server" class="logbox"></pre>

<h2>ログ: サービス</h2>
<pre id="log-svc" class="logbox"></pre>
<div class="row">
  <button id="btn-start">起動</button>
  <button id="btn-restart">再起動</button>
  <button id="btn-stop" class="sub">停止</button>
  <span class="note">状態とログは自動更新されます</span>
</div>

<h2>denpa 本体</h2>
<p class="note">番組表・予約・チューナーなどの設定は denpa 本体の画面（ポート 3000）で行います。</p>
<div class="row">
  <a class="btn" href="http://127.0.0.1:3000/">denpa を開く</a>
</div>
<p class="note">denpa-magisk module: AGPL-3.0-or-later — <a href="https://github.com/tgw314/denpa-magisk">module source</a> · denpa: AGPL-3.0-or-later — <a href="https://github.com/danything/denpa">upstream source</a></p>

<script type="module">
import { exec } from "./kernelsu.js";

const MOD = "/data/adb/modules/denpa";
const DATA = "/data/adb/denpa";
const $ = (id) => document.getElementById(id);

let busy = false;
let ticking = false;

async function ctl(arg) {
  const r = await exec(`sh ${MOD}/ctl.sh ${arg}`);
  return ((r.stdout || "") + (r.stderr || "")).trim();
}

function setButtons(state) {
  $("btn-start").disabled = busy || state === "running";
  $("btn-restart").disabled = busy || state === "stopped";
  $("btn-stop").disabled = busy || state === "stopped";
}

function setLog(el, text) {
  if (el.textContent === text) return;
  const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 8;
  const top = el.scrollTop;
  el.textContent = text;
  el.scrollTop = atBottom ? el.scrollHeight : top;
}

async function refreshStatus() {
  $("status").textContent = await ctl("status");
  setButtons(await ctl("state"));
}

async function refreshLogs() {
  for (const [id, file] of [["log-agent", "agent.log"], ["log-server", "server.log"], ["log-svc", "service.log"]]) {
    const r = await exec(`tail -n 60 ${DATA}/${file} 2>/dev/null`);
    setLog($(id), (r.stdout || "").trim());
  }
}

async function refresh() {
  try {
    await refreshStatus();
    await refreshLogs();
  } catch (e) {
    $("status").textContent = "マネージャーの WebUI の外では動作しません: " + e;
  }
}

async function act(arg, label, target) {
  if (busy) return;
  busy = true;
  setButtons("");
  $("status").textContent = label;
  try {
    await ctl(arg);
    for (let i = 0; i < 30; i++) {
      if ((await ctl("state")) === target) break;
      await new Promise((r) => setTimeout(r, 1000));
    }
  } catch (e) { /* refresh() で実状態に戻す */ }
  busy = false;
  await refresh();
}
$("btn-start").onclick = () => act("start", "起動中…", "running");
$("btn-stop").onclick = () => act("stop", "停止中…", "stopped");
$("btn-restart").onclick = () => act("restart", "再起動中…", "running");

setInterval(async () => {
  if (document.hidden || busy || ticking) return;
  ticking = true;
  try {
    await refreshStatus();
    await refreshLogs();
  } catch (e) { /* 次の周期で再試行 */ }
  ticking = false;
}, 3000);

refresh();
</script>
</body>
</html>
