name: build

# Build the module whenever a new upstream denpa release
# appears. GitHub cannot trigger on another repo's releases, so a
# schedule polls the upstream latest release; if this repo has no
# release for that version yet, build and publish one.
#
# The module does not ship the APK's FFmpeg untouched: build.sh splices in
# FFmpeg built from the same upstream source plus
# patches/ffmpeg-mediacodec-align.patch (see patches/README.md), so this
# workflow builds that first with upstream's own
# .github/ffmpeg-android.sh (helper/build-ffmpeg.sh does the work). The
# result is cached: it only costs the ~30 minutes again when the upstream
# FFmpeg version, the patch or the NDK changes.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "denpa version to build (e.g. 2.45.1); empty = latest"
        required: false
        type: string
      force:
        description: "rebuild even if a release for the version exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream version
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            V="${INPUT_VERSION#v}"
          else
            V=$(gh api repos/danything/denpa/releases/latest --jq .tag_name | sed 's/^v//')
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "upstream denpa version: $V"

      - name: Check whether this version is already built
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          V: ${{ steps.up.outputs.version }}
        run: |
          if [ "$FORCE" != "true" ] && gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "release v$V already exists; nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch upstream source tarball
        if: steps.check.outputs.skip != 'true'
        env:
          V: ${{ steps.up.outputs.version }}
        run: |
          curl -fsSL -o "denpa-$V-source.tar.gz" \
            "https://github.com/danything/denpa/archive/refs/tags/v$V.tar.gz"

      # Two keys: the dependencies (opus, SVT-AV1, x264, dav1d, zimg) only
      # follow the upstream source and the NDK, the final libraries also
      # follow this repo's patches. Editing a patch therefore reuses the
      # dependencies.
      - name: Cache keys for the patched FFmpeg
        id: ffkey
        if: steps.check.outputs.skip != 'true'
        env:
          V: ${{ steps.up.outputs.version }}
        run: |
          set -eu
          src="denpa-$V-source.tar.gz"
          src16=$(sha256sum "$src" | cut -c1-16)
          patch16=$(sha256sum patches/ffmpeg-*.patch | sha256sum | cut -c1-16)
          echo "deps=ffmpeg-android-arm64-deps-$src16" >> "$GITHUB_OUTPUT"
          echo "out=ffmpeg-android-arm64-$src16-$patch16" >> "$GITHUB_OUTPUT"

      - name: Restore patched FFmpeg libraries
        id: ffout
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: work/ffmpeg
          key: ${{ steps.ffkey.outputs.out }}

      - name: Restore FFmpeg dependencies
        id: ffdeps
        if: steps.check.outputs.skip != 'true' && steps.ffout.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-android-arm64-deps
          key: ${{ steps.ffkey.outputs.deps }}

      # The NDK version is the one upstream's own Android workflow pins for
      # this tag (helper/build-ffmpeg.sh --ndk-version reads it), plus the
      # tools that .github/ffmpeg-android.sh needs.
      - name: Set up NDK and tools for the FFmpeg build
        if: steps.check.outputs.skip != 'true' && steps.ffout.outputs.cache-hit != 'true'
        env:
          DENPA_VERSION: ${{ steps.up.outputs.version }}
          DENPA_SOURCE_TARBALL: denpa-${{ steps.up.outputs.version }}-source.tar.gz
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            nasm meson ninja-build autoconf automake libtool pkg-config cmake > /dev/null
          NDK_VERSION=$(./helper/build-ffmpeg.sh --ndk-version)
          echo "NDK $NDK_VERSION"
          # yes は sdkmanager が閉じると SIGPIPE で終わるので、終わり方を見ない
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build patched FFmpeg
        if: steps.check.outputs.skip != 'true' && steps.ffout.outputs.cache-hit != 'true'
        env:
          DENPA_VERSION: ${{ steps.up.outputs.version }}
          DENPA_SOURCE_TARBALL: denpa-${{ steps.up.outputs.version }}-source.tar.gz
        run: ./helper/build-ffmpeg.sh

      # 依存は組み終えた直後に保存する (ffmpeg のビルドが落ちても残る)
      - name: Save FFmpeg dependencies
        if: steps.check.outputs.skip != 'true' && steps.ffout.outputs.cache-hit != 'true' && steps.ffdeps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-android-arm64-deps
          key: ${{ steps.ffkey.outputs.deps }}

      - name: Save patched FFmpeg libraries
        if: steps.check.outputs.skip != 'true' && steps.ffout.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/ffmpeg
          key: ${{ steps.ffkey.outputs.out }}

      - name: Build module zip
        if: steps.check.outputs.skip != 'true'
        env:
          DENPA_VERSION: ${{ steps.up.outputs.version }}
        run: ./build.sh

      - name: Fetch asicen-userland source (GPL-2.0 payload component)
        id: asicen
        if: steps.check.outputs.skip != 'true'
        env:
          V: ${{ steps.up.outputs.version }}
        run: |
          SRCTXT=$(unzip -p "work/denpa-$V.apk" assets/licenses/asicen-userland/SOURCE.txt)
          URL=$(printf '%s\n' "$SRCTXT" | grep -o 'https://[^ ]*source\.tar\.gz' | head -n 1)
          SHA=$(printf '%s\n' "$SRCTXT" | grep -oE '[0-9a-f]{64}' | head -n 1)
          FILE=$(basename "$URL")
          curl -fsSL -o "$FILE" "$URL"
          echo "$SHA  $FILE" | sha256sum -c -
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Fetch FFmpeg component sources (GPL payload components)
        if: steps.check.outputs.skip != 'true'
        env:
          V: ${{ steps.up.outputs.version }}
        run: |
          mkdir -p component-sources
          unzip -p "work/denpa-$V.apk" assets/licenses/ffmpeg/SOURCE.txt \
            | grep -o 'https://[^ ]*' | grep -E '\.tar\.(bz2|gz|xz)$' | sort -u \
            > mirror-urls.txt
          test -s mirror-urls.txt
          while read -r u; do
            curl -fsSL -o "component-sources/$(basename "$u")" "$u"
          done < mirror-urls.txt
          ls -la component-sources

      - name: Bundle payload component sources into one asset
        id: bundle
        if: steps.check.outputs.skip != 'true'
        env:
          ASF: ${{ steps.asicen.outputs.file }}
        run: |
          mv "$ASF" component-sources/
          # The two files that make the payload different from the APK's own
          # (licenses/SOURCE-denpa.txt "MODIFIED PARTS"). Their source is the
          # FFmpeg tarballs above plus these, so they belong in the bundle.
          mkdir -p component-sources/denpa-magisk
          cp patches/ffmpeg-mediacodec-align.patch helper/patch-server-align.py \
            component-sources/denpa-magisk/
          cat > component-sources/denpa-magisk/README.txt <<'PATCHES'
          What this module changes in the denpa payload
          ============================================

          ffmpeg-mediacodec-align.patch
              Applied to the upstream FFmpeg source (the ffmpeg-*.tar.*
              tarballs in this bundle) by upstream's own
              .github/ffmpeg-android.sh from the denpa source tarball of
              the same tag. Adds -align_width/-align_height to
              h264_mediacodec and hevc_mediacodec so the coded size is
              aligned to the 128x32 that Qualcomm's MediaCodec (Venus,
              c2.qti.*) reads its input buffer with. The nine FFmpeg
              libraries in the module zip are built from this.

          patch-server-align.py
              Applied to the server chunk that builds the
              MediaCodec encoder args (found by content;
              chunks/hwenc.js up to 2.59.0, chunks/transcode.js in
              2.61.0) from assets/server.zip in the official APK. Adds
              ...mediacodecAlign(codec) to the two MediaCodec encoder
              argument arrays (h264/hevc only), i.e. the two options the
              patch above introduces. The patched chunk is the upstream
              one plus this insert; nothing else in the server changes.

          The corresponding sources are the tarballs in this bundle and
          this file.
          PATCHES
          SUMS=$(cd component-sources && find . -type f -print | sed 's|^\./||' | sort | xargs -r sha256sum)
          printf '%s\n' "$SUMS" > component-sources/SHA256SUMS
          tar -cf component-sources.tar -C component-sources .
          {
            echo "sha256=$(sha256sum component-sources.tar | awk '{print $1}')"
            echo "lines<<DELIM"
            printf '%s\n' "$SUMS" | awk '{printf "- `%s` (sha256: `%s`)\n", $2, $1}'
            echo "DELIM"
          } >> "$GITHUB_OUTPUT"
          ls -la component-sources.tar

      - name: Publish release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.up.outputs.version }}
          BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
          BUNDLE_LINES: ${{ steps.bundle.outputs.lines }}
        run: |
          ZIP=$(ls denpa-v"$V"-r*.zip)
          REV=$(cat module-rev)
          APK_SHA256=$(curl -fsSL "https://github.com/danything/denpa/releases/download/v$V/denpa-$V-android-arm64.apk.sha256" | awk '{print $1}')
          ZIP_SHA256=$(sha256sum "$ZIP" | awk '{print $1}')
          SRC_SHA256=$(sha256sum "denpa-$V-source.tar.gz" | awk '{print $1}')
          NOTES=$(cat <<EOF
          Module packaging denpa **v$V** for Magisk / KernelSU / APatch (module revision r$REV).

          The payload is extracted from the official Android APK
          \`denpa-$V-android-arm64.apk\` (sha256: \`$APK_SHA256\`, verified
          against the upstream release's own .sha256 at build time), with
          two exceptions (see \`licenses/SOURCE-denpa.txt\` in the zip):

          - The nine FFmpeg libraries (\`libav*.so\`, \`libsw*.so\`,
            \`libffmpeg.so\`, \`libffprobe.so\`) are rebuilt from the FFmpeg
            source of the same upstream tag with
            \`ffmpeg-mediacodec-align.patch\`, which adds
            \`-align_width\`/\`-align_height\` to \`h264_mediacodec\` and
            \`hevc_mediacodec\`. FFmpeg's existing 16-pixel alignment is not
            enough for Qualcomm's MediaCodec (Venus, \`c2.qti.*\`), which
            reads a 1440-wide buffer with a stride of 1536; the module asks
            for a 128x32 coded alignment, and the existing
            \`h264_metadata\`/\`hevc_metadata\` filter crops the picture back
            to the display size. 1440-wide H.264/HEVC no longer comes out
            with horizontal streaks and a green band.
          - The server bundle's MediaCodec chunk (`chunks/hwenc.js`,
            `chunks/transcode.js` in 2.61.0) passes those two options for
            H.264/H.265 MediaCodec encoding (AV1 MediaCodec and the other
            encoding ways are untouched).

          Both patches are inside \`component-sources.tar\` under
          \`denpa-magisk/\`, together with the FFmpeg component sources they
          apply to. The rest of the payload — denpa's own native libraries,
          the software encoders, every other server file — is the APK's
          file, byte for byte.

          Module zip sha256: \`$ZIP_SHA256\`

          denpa (server) is AGPL-3.0-or-later and the tuner agent is MPL-2.0.
          The upstream source tarball for v$V is attached to this release as
          \`denpa-$V-source.tar.gz\` (sha256: \`$SRC_SHA256\`) and is also available at
          https://github.com/danything/denpa/releases/tag/v$V

          The remaining payload component sources — asicen-userland
          (GPL-2.0) and the FFmpeg components (GPL) — are bundled,
          each as its original tarball, in \`component-sources.tar\`
          (sha256: \`$BUNDLE_SHA256\`; the bundle also contains a
          SHA256SUMS file with the same values):
          $BUNDLE_LINES
          EOF
          )
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # force rebuild: replace the assets on the existing release
            gh release upload "v$V" --repo "$GITHUB_REPOSITORY" --clobber "$ZIP" "denpa-$V-source.tar.gz" component-sources.tar
            gh release edit "v$V" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create "v$V" --repo "$GITHUB_REPOSITORY" \
              --title "denpa v$V (module r$REV)" --notes "$NOTES" \
              "$ZIP" "denpa-$V-source.tar.gz" component-sources.tar
          fi

      - name: Update update.json for manager update checks
        if: steps.check.outputs.skip != 'true'
        env:
          V: ${{ steps.up.outputs.version }}
        run: |
          REV=$(cat module-rev)
          VMAJOR=${V%%.*}
          VREST=${V#*.}
          VMINOR=${VREST%%.*}
          VPATCH=${VREST#*.}
          VPATCH=${VPATCH%%.*}
          CODE=$((VMAJOR * 1000000 + VMINOR * 10000 + VPATCH * 100 + REV))
          cat > update.json <<EOF
          {
            "version": "v$V-r$REV",
            "versionCode": $CODE,
            "zipUrl": "https://github.com/$GITHUB_REPOSITORY/releases/download/v$V/denpa-v$V-r$REV.zip",
            "changelog": "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$V"
          }
          EOF
          git config user.name "tgw314"
          git config user.email "me@k0k1.dev"
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json unchanged"
          else
            git commit -m "update.json: denpa v$V-r$REV"
            git push origin HEAD:main
          fi
